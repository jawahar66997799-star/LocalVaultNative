name: Jawahar v3 Direct Fast Safe
on:
  push:
    branches: [ jawahar-v3-direct-fast ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact direct-fast source
        shell: bash
        run: |
          set -euo pipefail
          cat jss-v3-final/chunks/part*.b64 | base64 --decode > /tmp/jss-v3.zip
          echo "a4c6c5828f1265ec8bf627e9ae90be79ae81896a69049366ef5750df4211672a  /tmp/jss-v3.zip" | sha256sum -c -
          rm -rf /tmp/jss-v3
          mkdir -p /tmp/jss-v3
          unzip -q /tmp/jss-v3.zip -d /tmp/jss-v3
          cd /tmp/jss-v3/JawaharSecureShare-v1/android
          sed -i "s|^def ownerToken=.*|def ownerToken=(project.findProperty('JAWAHAR_OWNER_TOKEN') ?: '').toString()|" owner/build.gradle
          grep -q "io.github.webrtc-sdk:android:150.7871.01" core/build.gradle
          grep -q "kpioireofvsaelqryeim.supabase.co/functions/v1/jawahar-api" owner/build.gradle
          grep -q "kpioireofvsaelqryeim.supabase.co/functions/v1/jawahar-api" friend/build.gradle
          if grep -R -q "JAW-" owner/src owner/build.gradle; then
            echo "Owner secret remains in build source"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build release
        working-directory: /tmp/jss-v3/JawaharSecureShare-v1/android
        run: gradle --no-daemon :owner:assembleRelease :friend:assembleRelease --stacktrace
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p /tmp/out
          cp /tmp/jss-v3/JawaharSecureShare-v1/android/owner/build/outputs/apk/release/owner-release-unsigned.apk /tmp/out/Jawahar-Owner-v3-Safe-unsigned.apk
          cp /tmp/jss-v3/JawaharSecureShare-v1/android/friend/build/outputs/apk/release/friend-release-unsigned.apk /tmp/out/Jawahar-v3-Safe-unsigned.apk
          cp "$BT/lib/apksigner.jar" /tmp/out/apksigner.jar
          "$BT/aapt" dump badging /tmp/out/Jawahar-Owner-v3-Safe-unsigned.apk > /tmp/out/OWNER_BADGING.txt
          "$BT/aapt" dump badging /tmp/out/Jawahar-v3-Safe-unsigned.apk > /tmp/out/FRIEND_BADGING.txt
          "$BT/aapt" dump permissions /tmp/out/Jawahar-Owner-v3-Safe-unsigned.apk > /tmp/out/OWNER_PERMISSIONS.txt
          "$BT/aapt" dump permissions /tmp/out/Jawahar-v3-Safe-unsigned.apk > /tmp/out/FRIEND_PERMISSIONS.txt
          sha256sum /tmp/out/*.apk > /tmp/out/UNSIGNED_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jawahar-v3-direct-fast-safe-unsigned
          path: /tmp/out/*
          retention-days: 7
          if-no-files-found: error
