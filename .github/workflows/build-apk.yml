name: Build Jawahar File v0.5 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct verified base source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.b64 | base64 --decode > /tmp/LocalVaultNative-v0.4.0.zip
          echo "99fd75ecf4df58c60988e7046fde99eab0a3076eee8a3570c0a33674dabc85a3  /tmp/LocalVaultNative-v0.4.0.zip" | sha256sum -c -
          rm -rf /tmp/localvault-src
          mkdir -p /tmp/localvault-src
          unzip -q /tmp/LocalVaultNative-v0.4.0.zip -d /tmp/localvault-src
          test -f /tmp/localvault-src/LocalVaultNative/app/build.gradle.kts

      - name: Prepare Jawahar File v0.5
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/prepare_jawahar_file_v050.py
          cd /tmp/localvault-src/LocalVaultNative
          ! grep -R "MANAGE_EXTERNAL_STORAGE" app/src/main/AndroidManifest.xml
          grep -q 'android:label="Jawahar File"' app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.jawahar.file"' app/build.gradle.kts
          grep -q 'versionName = "0.5.0"' app/build.gradle.kts
          grep -q 'BiometricPrompt' app/src/main/java/com/localvault/filemanager/MainActivity.kt
          grep -q 'FLAG_SECURE' app/src/main/java/com/localvault/filemanager/MainActivity.kt
          grep -q 'collectAsStateWithLifecycle' app/src/main/java/com/localvault/filemanager/ui/FileManagerScreen.kt
          grep -q 'ThumbnailCache' app/src/main/java/com/localvault/filemanager/ui/FileManagerScreen.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, Android lint, and release build
        working-directory: /tmp/localvault-src/LocalVaultNative
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK identity, privacy and signature
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/localvault-src/LocalVaultNative/app/build/outputs/apk/release/app-release.apk
          OUT=/tmp/Jawahar-File-v0.5.0.apk
          test -s "$SRC"
          cp "$SRC" "$OUT"

          unzip -t "$OUT" >/dev/null

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$OUT" | tee /tmp/jawahar-permissions.txt
          if grep -q "MANAGE_EXTERNAL_STORAGE" /tmp/jawahar-permissions.txt; then
            echo "ERROR: broad storage permission is present"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$OUT" | tee /tmp/jawahar-badging.txt
          grep -q "package: name='com.jawahar.file'" /tmp/jawahar-badging.txt
          grep -q "application-label:'Jawahar File'" /tmp/jawahar-badging.txt

          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Upload installable Jawahar File APK
        uses: actions/upload-artifact@v4
        with:
          name: Jawahar-File-v0.5.0-secure-release-apk
          path: /tmp/Jawahar-File-v0.5.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jawahar-File-v0.5.0-quality-reports
          path: |
            /tmp/localvault-src/LocalVaultNative/app/build/reports/tests/
            /tmp/localvault-src/LocalVaultNative/app/build/reports/lint-results-release.html
            /tmp/localvault-src/LocalVaultNative/app/build/reports/lint-results-release.txt
          if-no-files-found: ignore
          retention-days: 14
