name: Build Jawahar file v0.5.1 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct verified base source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part*.b64 | base64 --decode > /tmp/LocalVaultNative-v0.4.0.zip
          echo "99fd75ecf4df58c60988e7046fde99eab0a3076eee8a3570c0a33674dabc85a3  /tmp/LocalVaultNative-v0.4.0.zip" | sha256sum -c -
          rm -rf /tmp/localvault-src
          mkdir -p /tmp/localvault-src
          unzip -q /tmp/LocalVaultNative-v0.4.0.zip -d /tmp/localvault-src
          test -f /tmp/localvault-src/LocalVaultNative/app/build.gradle.kts

      - name: Prepare Jawahar file v0.5.1
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/prepare_jawahar_file_v050.py
          python3 ci/prepare_jawahar_file_v051.py
          cd /tmp/localvault-src/LocalVaultNative

          python3 - <<'PY'
          from pathlib import Path
          root = Path(".")
          manifest = (root / "app/src/main/AndroidManifest.xml").read_text()
          gradle = (root / "app/build.gradle.kts").read_text()
          main = (root / "app/src/main/java/com/localvault/filemanager/MainActivity.kt").read_text()
          screen = (root / "app/src/main/java/com/localvault/filemanager/ui/FileManagerScreen.kt").read_text()

          checks = {
              "no broad storage permission": "MANAGE_EXTERNAL_STORAGE" not in manifest,
              "exact app label": 'android:label="Jawahar file"' in manifest,
              "package id": 'applicationId = "com.jawahar.file"' in gradle,
              "v0.5.1": 'versionName = "0.5.1"' in gradle,
              "device admin receiver": "UninstallProtectionReceiver" in manifest,
              "biometric gate": "BiometricPrompt" in main,
              "screen privacy": "FLAG_SECURE" in main,
              "fresh sensitive-action auth": "authenticateFresh" in main,
              "lifecycle state": "collectAsStateWithLifecycle" in screen,
              "thumbnail cache": "ThumbnailCache" in screen,
          }

          for label, ok in checks.items():
              print(f"{label}: {'PASS' if ok else 'FAIL'}")
              if not ok:
                  raise SystemExit(1)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, Android lint, and release build
        working-directory: /tmp/localvault-src/LocalVaultNative
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK identity, security, privacy and signature
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/localvault-src/LocalVaultNative/app/build/outputs/apk/release/app-release.apk
          OUT=/tmp/Jawahar-file-v0.5.1.apk
          test -s "$SRC"
          cp "$SRC" "$OUT"

          unzip -t "$OUT" >/dev/null

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$OUT"

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$OUT" | tee /tmp/jawahar-permissions.txt
          if grep -q "MANAGE_EXTERNAL_STORAGE" /tmp/jawahar-permissions.txt; then
            echo "ERROR: broad storage permission is present"
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$OUT" | tee /tmp/jawahar-badging.txt
          grep -q "package: name='com.jawahar.file'" /tmp/jawahar-badging.txt
          grep -q "versionName='0.5.1'" /tmp/jawahar-badging.txt
          grep -q "application-label:'Jawahar file'" /tmp/jawahar-badging.txt

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$OUT" AndroidManifest.xml | tee /tmp/jawahar-manifest.txt
          grep -q "UninstallProtectionReceiver" /tmp/jawahar-manifest.txt
          grep -q "android.permission.BIND_DEVICE_ADMIN" /tmp/jawahar-manifest.txt

          sha256sum "$OUT"
          ls -lh "$OUT"

      - name: Upload installable Jawahar file APK
        uses: actions/upload-artifact@v4
        with:
          name: Jawahar-file-v0.5.1-secure-professional-apk
          path: /tmp/Jawahar-file-v0.5.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jawahar-file-v0.5.1-quality-reports
          path: |
            /tmp/localvault-src/LocalVaultNative/app/build/reports/tests/
            /tmp/localvault-src/LocalVaultNative/app/build/reports/lint-results-release.html
            /tmp/localvault-src/LocalVaultNative/app/build/reports/lint-results-release.txt
          if-no-files-found: ignore
          retention-days: 14
