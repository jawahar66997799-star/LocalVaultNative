name: Build Jawahar Secure Share APKs
on:
  push:
    branches:
      - jawahar-secure-share-build-20260930
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat jss-build/chunks/jss.part.* | base64 --decode > /tmp/jss-source.zip
          mkdir -p /tmp/jss
          unzip -q -o /tmp/jss-source.zip -d /tmp/jss
          test -f /tmp/jss/JawaharSecureShare-v1/android/settings.gradle
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable APKs
        working-directory: /tmp/jss/JawaharSecureShare-v1/android
        shell: bash
        run: gradle --no-daemon :owner:assembleDebug :friend:assembleDebug -PJAWAHAR_BACKEND_URL=https://REPLACE-ME.workers.dev --stacktrace
      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p /tmp/out
          cp /tmp/jss/JawaharSecureShare-v1/android/owner/build/outputs/apk/debug/owner-debug.apk /tmp/out/Jawahar-Owner.apk
          cp /tmp/jss/JawaharSecureShare-v1/android/friend/build/outputs/apk/debug/friend-debug.apk /tmp/out/Jawahar.apk
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose --print-certs /tmp/out/Jawahar-Owner.apk
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose --print-certs /tmp/out/Jawahar.apk
          sha256sum /tmp/out/*.apk > /tmp/out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jawahar-Secure-Share-apks
          path: /tmp/out/*
          retention-days: 7
          if-no-files-found: error
