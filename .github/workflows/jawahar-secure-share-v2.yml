PAYLOAD
          base64 --decode /tmp/jss.tar.gz.b64 > /tmp/jss.tar.gz
          echo "142c5d9859bd1340fcf832e33269419e690cff01306a0ef87d999d70d4b9afd8  /tmp/jss.tar.gz" | sha256sum -c -
          mkdir -p /tmp/jss
          tar -xzf /tmp/jss.tar.gz -C /tmp/jss
          test -f /tmp/jss/android/settings.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Source security checks
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/jss/android
          ! grep -R "MANAGE_EXTERNAL_STORAGE" -n owner/src friend/src core/src
          ! grep -R "FileProvider" -n owner/src friend/src core/src
          grep -R "FLAG_SECURE" -n core/src
          grep -R "HIDE_OVERLAY_WINDOWS" -n owner/src/main/AndroidManifest.xml friend/src/main/AndroidManifest.xml
          grep -R "ActivityReporter" -n friend/src/main/java
          grep -R "Device activity dashboard" -n owner/src/main/java

      - name: Build unsigned release APKs
        working-directory: /tmp/jss/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :owner:assembleRelease :friend:assembleRelease --stacktrace

      - name: Sign, verify and audit APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p /tmp/out
          keytool -genkeypair -v -keystore /tmp/jawahar-release.jks -storepass jawaharBuild2026 -keypass jawaharBuild2026 -alias jawahar -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=Jawahar Secure Share, OU=Private Release, O=Jawahar, C=IN"

          for spec in "owner:Jawahar-Owner-v2.0.0.apk" "friend:Jawahar-v2.0.0.apk"; do
            mod="${spec%%:*}"
            out="${spec#*:}"
            src="/tmp/jss/android/$mod/build/outputs/apk/release/$mod-release-unsigned.apk"
            test -s "$src"
            "$BT/zipalign" -f -p 4 "$src" "/tmp/out/aligned-$out"
            "$BT/apksigner" sign --ks /tmp/jawahar-release.jks --ks-pass pass:jawaharBuild2026 --key-pass pass:jawaharBuild2026 --out "/tmp/out/$out" "/tmp/out/aligned-$out"
            rm "/tmp/out/aligned-$out"
            "$BT/apksigner" verify --verbose --print-certs "/tmp/out/$out"
            unzip -t "/tmp/out/$out" >/dev/null
          done

          "$BT/aapt" dump permissions /tmp/out/Jawahar-Owner-v2.0.0.apk | tee /tmp/owner-perms.txt
          "$BT/aapt" dump permissions /tmp/out/Jawahar-v2.0.0.apk | tee /tmp/friend-perms.txt
          ! grep -q "MANAGE_EXTERNAL_STORAGE" /tmp/owner-perms.txt
          ! grep -q "MANAGE_EXTERNAL_STORAGE" /tmp/friend-perms.txt

          "$BT/aapt" dump badging /tmp/out/Jawahar-Owner-v2.0.0.apk | tee /tmp/owner-badging.txt
          "$BT/aapt" dump badging /tmp/out/Jawahar-v2.0.0.apk | tee /tmp/friend-badging.txt
          grep -q "application-label:'Jawahar Owner'" /tmp/owner-badging.txt
          grep -q "application-label:'Jawahar'" /tmp/friend-badging.txt

          sha256sum /tmp/out/*.apk > /tmp/out/SHA256SUMS.txt
          ls -lh /tmp/out

      - uses: actions/upload-artifact@v4
        with:
          name: Jawahar-Secure-Share-v2-final-apks
          path: /tmp/out/*
          if-no-files-found: error
          retention-days: 30